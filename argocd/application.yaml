apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: production-grade-gitops
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/atique5md/production-grade-gitops-microservices.git
    targetRevision: main
    path: kubernetes

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
